services:
  postgres:
    image: postgres:17
    container_name: sportsphere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sportsphere
      POSTGRES_PASSWORD: sportsphere_dev
      POSTGRES_DB: sportsphere

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sportsphere-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: